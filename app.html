<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Healthy Day</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F3F1EA; --line:#E6E2D8;
    --text:#26241F; --text-muted:#6F6C63; --text-dim:#A6A296;
    --amber:#C67A1E; --amber-dim:#C67A1E1F;
    --green:#2E9563; --green-dim:#2E95631F;
    --red:#C4483C; --red-dim:#C4483C1F;
    --mono:'IBM Plex Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:#EFECE4; font-family:var(--sans); display:flex; justify-content:center; min-height:100vh; margin:0; }
  .phone{ width:100%; max-width:412px; height:100dvh; background:var(--bg); display:flex; flex-direction:column; position:relative; }
  @media (min-width:560px){
    body{ padding:40px 16px; }
    .phone{ height:850px; border-radius:36px; border:1px solid #DEDACE; overflow:hidden; box-shadow:0 30px 70px -25px rgba(60,50,30,0.28); }
  }
  .statusbar{ height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .statusbar .logout{ cursor:pointer; text-decoration:underline; }
  .header{ padding:8px 20px 18px; border-bottom:1px solid var(--line); }
  .header .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:0.14em; color:var(--amber); text-transform:uppercase; margin-bottom:6px; }
  .header h1{ font-size:21px; font-weight:700; }
  .header .date{ font-family:var(--mono); font-size:12px; color:var(--text-muted); margin-top:4px; }
  .screen{ flex:1; overflow-y:auto; padding:20px 18px 100px; display:none; }
  .screen.active{ display:block; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:0; margin-bottom:12px; overflow:hidden; transition:border-color .25s, background .25s; }
  .acc-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; cursor:pointer; }
  .acc-header-left{ display:flex; align-items:center; gap:10px; }
  .acc-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-dim); transition:background .25s, box-shadow .25s; flex-shrink:0; }
  .acc-title{ font-size:14px; font-weight:600; color:var(--text-muted); transition:color .25s; }
  .acc-preview{ font-family:var(--mono); font-size:11px; color:var(--text-dim); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:color .25s; }
  .acc-right{ display:flex; align-items:center; gap:10px; }
  .acc-chevron{ width:9px; height:9px; border-right:1.6px solid var(--text-dim); border-bottom:1.6px solid var(--text-dim); transform:rotate(45deg); transition:transform .25s, border-color .25s; margin-top:-3px; }
  .card.open .acc-chevron{ transform:rotate(-135deg); margin-top:3px; }
  .acc-body{ max-height:0; overflow:hidden; transition:max-height .3s, padding .3s; padding:0 18px; }
  .card.open .acc-body{ max-height:2400px; padding:0 18px 18px; }
  .card.filled{ border-color:#CFE3D6; background:#F4FAF6; }
  .card.filled .acc-dot{ background:var(--green); box-shadow:0 0 0 3px var(--green-dim); }
  .card.filled .acc-title{ color:var(--text); }
  .card.filled .acc-preview{ color:var(--green); }

  label.field-title{ display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin:14px 0 6px; }
  label.field-title:first-child{ margin-top:0; }
  input[type=text], input[type=number], textarea{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:9px;
    font-size:13.5px; background:var(--surface-2); color:var(--text); outline:none; font-family:var(--sans);
  }
  input:focus, textarea:focus{ border-color:var(--amber); }
  textarea{ resize:vertical; min-height:52px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .steps-row{ display:flex; align-items:baseline; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .steps-row input{ background:none; border:none; padding:0; font-family:var(--mono); font-size:24px; font-weight:600; width:120px; }
  .steps-row .unit{ font-family:var(--mono); font-size:13px; color:var(--text-muted); }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ font-size:12.5px; padding:9px 13px; border-radius:20px; border:1px solid var(--line); background:var(--surface-2); color:var(--text-muted); cursor:pointer; }
  .chip.selected{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); font-weight:600; }

  .level-row{ display:flex; gap:6px; margin-bottom:16px; }
  .level-opt{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; }
  .level-opt .lv-num{ font-family:var(--mono); font-size:15px; font-weight:700; color:var(--text-muted); }
  .level-opt .lv-label{ font-size:9.5px; color:var(--text-dim); text-align:center; line-height:1.2; }
  .level-opt.selected{ background:var(--amber-dim); border-color:var(--amber); }
  .level-opt.selected .lv-num, .level-opt.selected .lv-label{ color:var(--amber); font-weight:700; }

  .cat-group{ margin-bottom:14px; }
  .cat-group:last-child{ margin-bottom:0; }
  .cat-title{ font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:7px; }
  .cat-chip{ font-size:11.5px; padding:7px 11px; border-radius:16px; border:1px solid var(--line); background:var(--surface-2); color:var(--text-muted); cursor:pointer; }
  .cat-chip.selected{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); font-weight:600; }
  .kcal-readout{ margin-top:14px; padding:11px 13px; background:var(--surface-2); border-radius:9px; font-family:var(--mono); font-size:13px; font-weight:600; color:var(--text); display:flex; justify-content:space-between; align-items:center; }
  .kcal-readout .lbl{ font-family:var(--sans); font-size:11px; font-weight:500; color:var(--text-dim); }
  .memo-input{ margin-top:12px; }

  .meal-tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .meal-tab{ font-family:var(--mono); font-size:11px; padding:6px 10px; border-radius:7px; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--line); cursor:pointer; }
  .meal-tab.filled{ color:var(--text); border-color:var(--text-dim); }
  .meal-tab.active{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }
  .meal-block{ display:none; }
  .meal-block.active{ display:block; }

  .toggle-row{ display:flex; background:var(--surface-2); border-radius:9px; padding:2px; border:1px solid var(--line); }
  .toggle-opt{ padding:6px 10px; font-size:10.5px; font-weight:600; color:var(--text-dim); border-radius:7px; cursor:pointer; }
  .toggle-opt.active{ background:var(--surface); color:var(--amber); }

  .photo-drop{ display:flex; align-items:center; justify-content:center; border:1.5px dashed var(--line); border-radius:10px; padding:18px; background:var(--surface-2); cursor:pointer; font-size:12.5px; color:var(--text-muted); }
  .photo-drop input[type=file]{ display:none; }
  .photo-thumb{ width:100%; max-height:170px; object-fit:cover; border-radius:10px; margin-top:10px; display:block; }

  .detail-overlay{ position:absolute; inset:0; background:rgba(38,36,31,0.4); z-index:50; align-items:flex-end; }
  .detail-sheet{ background:var(--surface); width:100%; border-radius:20px 20px 0 0; padding:20px 18px 26px; max-height:78%; overflow-y:auto; }
  .detail-sheet-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .detail-title{ font-size:15px; font-weight:700; color:var(--text); }
  .detail-close{ font-family:var(--mono); font-size:11px; color:var(--text-dim); cursor:pointer; padding:4px 10px; border:1px solid var(--line); border-radius:8px; }

  .submit-btn{ width:100%; padding:16px; background:var(--amber); color:#FFF; font-weight:700; font-size:14.5px; border:none; border-radius:12px; margin-top:6px; cursor:pointer; }
  .submit-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .submit-hint{ text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:10px; }

  .gauge-card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px 18px 18px; margin-bottom:14px; position:relative; }
  .gauge-wrap{ display:flex; align-items:center; gap:20px; }
  .gauge-num .big{ font-family:var(--mono); font-size:32px; font-weight:600; line-height:1; }
  .gauge-num .label{ font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:6px; }
  .balance-bar{ flex:1; }
  .balance-track{ height:8px; background:var(--surface-2); border-radius:5px; position:relative; overflow:hidden; margin-bottom:8px; }
  .balance-fill{ position:absolute; top:0; bottom:0; background:linear-gradient(90deg, var(--amber), var(--green)); border-radius:5px; }
  .balance-labels{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--text-dim); }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .stat-box{ background:var(--surface-2); border-radius:10px; padding:12px 14px; }
  .stat-box .k{ font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-bottom:5px; }
  .stat-box .v{ font-family:var(--mono); font-size:16px; font-weight:600; }

  .analysis-line{ display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); font-size:12.5px; line-height:1.55; }
  .analysis-line:last-child{ border-bottom:none; }
  .analysis-line .tag{ font-family:var(--mono); font-size:10px; color:var(--text-dim); min-width:52px; padding-top:2px; }
  .analysis-line .body{ color:var(--text-muted); }
  .analysis-line .body b{ color:var(--text); font-weight:600; }
  .status-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; }
  .status-dot.ok{ background:var(--green); } .status-dot.warn{ background:var(--amber); } .status-dot.bad{ background:var(--red); }

  .weight-hero{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .weight-hero .num{ font-family:var(--mono); font-size:28px; font-weight:600; }
  .weight-hero .delta{ font-family:var(--mono); font-size:12px; color:var(--green); }
  .trend-meta{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--text-dim); font-size:12.5px; }

  .navbar{ position:absolute; bottom:0; left:0; right:0; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; padding:10px 24px 22px; }
  .nav-item{ flex:1; text-align:center; color:var(--text-dim); cursor:pointer; }
  .nav-item.active{ color:var(--amber); }
  .nav-icon{ width:22px; height:22px; margin:0 auto 5px; border:1.6px solid currentColor; border-radius:6px; }
  .nav-item:nth-child(2) .nav-icon{ border-radius:50%; }
  .nav-item:nth-child(3) .nav-icon{ border-radius:11px 11px 4px 4px; }
  .nav-label{ font-family:var(--mono); font-size:10px; }

  .app-title-bar{ padding:20px 0 14px; text-align:center; border-bottom:1px solid var(--line); }
  .app-title{ font-size:19px; font-weight:800; letter-spacing:-0.02em; color:var(--text); }

  .date-nav{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:2px; }
  .date-arrow{ width:26px; height:26px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text-muted); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .date-input-wrap{ position:relative; }
  .date-display{ font-family:var(--mono); font-size:13px; color:var(--text); font-weight:600; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); cursor:pointer; }
  .date-input-hidden{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .today-badge{ font-family:var(--mono); font-size:9.5px; color:var(--green); background:var(--green-dim); padding:2px 7px; border-radius:10px; margin-left:6px; }
  .past-badge{ font-family:var(--mono); font-size:9.5px; color:var(--amber); background:var(--amber-dim); padding:2px 7px; border-radius:10px; margin-left:6px; }

  .mypage-field{ margin-bottom:16px; }
  .mypage-save{ width:100%; padding:14px; background:var(--amber); color:#FFF; font-weight:700; font-size:13.5px; border:none; border-radius:12px; cursor:pointer; margin-top:4px; }
  .mypage-divider{ height:1px; background:var(--line); margin:24px 0 18px; }
  .mypage-email{ font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-bottom:14px; }
  .logout-btn{ width:100%; padding:13px; background:var(--surface-2); color:var(--red); font-weight:700; font-size:13px; border:1px solid var(--line); border-radius:12px; cursor:pointer; }
</style>
</head>
<body>

<div class="phone">
  <div class="app-title-bar">
    <div class="app-title">Healthy Day</div>
  </div>

  <!-- ===================== INPUT ===================== -->
  <div class="screen active" id="screen-input">
    <div class="header" style="border:none; padding:14px 0 18px;">
      <div class="date-nav">
        <button class="date-arrow" onclick="changeDate(-1)">‹</button>
        <div class="date-input-wrap">
          <span class="date-display" id="dateDisplay">—</span>
          <input type="date" id="dateInput" class="date-input-hidden" onchange="onDatePicked()">
        </div>
        <button class="date-arrow" onclick="changeDate(1)">›</button>
      </div>
    </div>

    <div class="card" id="card-steps" data-acc>
      <div class="acc-header" onclick="toggleCard(this)">
        <div class="acc-header-left"><span class="acc-dot"></span><span class="acc-title">걸음수 · 활동</span></div>
        <div class="acc-right"><span class="acc-preview" id="preview-steps">미입력</span><span class="acc-chevron"></span></div>
      </div>
      <div class="acc-body">
        <div class="steps-row">
          <input type="number" id="input-steps" placeholder="0" oninput="onFieldChange()">
          <span class="unit">보</span>
        </div>
      </div>
    </div>

    <div class="card" id="card-intensity" data-acc>
      <div class="acc-header" onclick="toggleCard(this)">
        <div class="acc-header-left"><span class="acc-dot"></span><span class="acc-title" id="intensityCardTitle">오늘 유형</span></div>
        <div class="acc-right"><span class="acc-preview" id="preview-intensity">미입력</span><span class="acc-chevron"></span></div>
      </div>
      <div class="acc-body">
        <label class="field-title" style="margin-top:0;">근무일 · 휴무일</label>
        <div class="chip-row" id="dayTypeToggle">
          <div class="chip" data-value="work">근무일</div>
          <div class="chip" data-value="rest">휴무일</div>
        </div>

        <div id="levelSection">
          <label class="field-title">체감 강도</label>
          <div class="level-row" id="levelRow">
            <div class="level-opt" data-level="1" data-bonus="60"><span class="lv-num">1</span><span class="lv-label">매우 여유</span></div>
            <div class="level-opt" data-level="2" data-bonus="120"><span class="lv-num">2</span><span class="lv-label">여유</span></div>
            <div class="level-opt" data-level="3" data-bonus="180"><span class="lv-num">3</span><span class="lv-label">보통</span></div>
            <div class="level-opt" data-level="4" data-bonus="260"><span class="lv-num">4</span><span class="lv-label">힘듦</span></div>
            <div class="level-opt" data-level="5" data-bonus="350"><span class="lv-num">5</span><span class="lv-label">매우 힘듦</span></div>
          </div>
        </div>

        <label class="field-title" id="workTypeTitle">작업 유형 (중복 선택 가능)</label>
        <div class="chip-row" id="workTypeChips"></div>
      </div>
    </div>

    <div class="card" id="card-meals" data-acc>
      <div class="acc-header" onclick="toggleCard(this)">
        <div class="acc-header-left"><span class="acc-dot"></span><span class="acc-title">칼로리 섭취</span></div>
        <div class="acc-right">
          <div class="toggle-row" id="mealModeToggle" onclick="event.stopPropagation()" style="margin-bottom:0;">
            <div class="toggle-opt active" data-mode="category">직접입력</div>
            <div class="toggle-opt" data-mode="photo">사진</div>
          </div>
          <span class="acc-preview" id="preview-meals">미입력</span><span class="acc-chevron"></span>
        </div>
      </div>
      <div class="acc-body">
        <div class="meal-tabs" id="mealTabs">
          <div class="meal-tab active" data-meal="breakfast">아침</div>
          <div class="meal-tab" data-meal="lunch">점심</div>
          <div class="meal-tab" data-meal="dinner">저녁</div>
          <div class="meal-tab" data-meal="snack">간식</div>
        </div>
        <div class="meal-block active" data-meal="breakfast">
          <div class="cat-container" id="cat-breakfast"></div>
          <div class="photo-input" id="photo-breakfast" style="display:none">
            <label class="photo-drop" for="photo-file-breakfast">
              <input type="file" accept="image/*" id="photo-file-breakfast" onchange="onPhotoSelected('breakfast', this)">
              <span id="photo-drop-label-breakfast">📷 사진 선택 / 촬영</span>
            </label>
            <img class="photo-thumb" id="photo-thumb-breakfast" style="display:none">
            <label class="field-title">추정 칼로리 직접 입력 (kcal)</label>
            <input type="number" id="photo-kcal-breakfast" oninput="onFieldChange()" placeholder="0">
          </div>
          <div class="kcal-readout"><span class="lbl">추정 칼로리</span><span id="kcal-breakfast">0 kcal</span></div>
        </div>
        <div class="meal-block" data-meal="lunch">
          <div class="cat-container" id="cat-lunch"></div>
          <div class="photo-input" id="photo-lunch" style="display:none">
            <label class="photo-drop" for="photo-file-lunch">
              <input type="file" accept="image/*" id="photo-file-lunch" onchange="onPhotoSelected('lunch', this)">
              <span id="photo-drop-label-lunch">📷 사진 선택 / 촬영</span>
            </label>
            <img class="photo-thumb" id="photo-thumb-lunch" style="display:none">
            <label class="field-title">추정 칼로리 직접 입력 (kcal)</label>
            <input type="number" id="photo-kcal-lunch" oninput="onFieldChange()" placeholder="0">
          </div>
          <div class="kcal-readout"><span class="lbl">추정 칼로리</span><span id="kcal-lunch">0 kcal</span></div>
        </div>
        <div class="meal-block" data-meal="dinner">
          <div class="cat-container" id="cat-dinner"></div>
          <div class="photo-input" id="photo-dinner" style="display:none">
            <label class="photo-drop" for="photo-file-dinner">
              <input type="file" accept="image/*" id="photo-file-dinner" onchange="onPhotoSelected('dinner', this)">
              <span id="photo-drop-label-dinner">📷 사진 선택 / 촬영</span>
            </label>
            <img class="photo-thumb" id="photo-thumb-dinner" style="display:none">
            <label class="field-title">추정 칼로리 직접 입력 (kcal)</label>
            <input type="number" id="photo-kcal-dinner" oninput="onFieldChange()" placeholder="0">
          </div>
          <div class="kcal-readout"><span class="lbl">추정 칼로리</span><span id="kcal-dinner">0 kcal</span></div>
        </div>
        <div class="meal-block" data-meal="snack">
          <div class="cat-container" id="cat-snack"></div>
          <div class="photo-input" id="photo-snack" style="display:none">
            <label class="photo-drop" for="photo-file-snack">
              <input type="file" accept="image/*" id="photo-file-snack" onchange="onPhotoSelected('snack', this)">
              <span id="photo-drop-label-snack">📷 사진 선택 / 촬영</span>
            </label>
            <img class="photo-thumb" id="photo-thumb-snack" style="display:none">
            <label class="field-title">추정 칼로리 직접 입력 (kcal)</label>
            <input type="number" id="photo-kcal-snack" oninput="onFieldChange()" placeholder="0">
          </div>
          <div class="kcal-readout"><span class="lbl">추정 칼로리</span><span id="kcal-snack">0 kcal</span></div>
        </div>
      </div>
    </div>

    <div class="card" id="card-scale" data-acc>
      <div class="acc-header" onclick="toggleCard(this)">
        <div class="acc-header-left"><span class="acc-dot"></span><span class="acc-title">스마트저울 측정값</span></div>
        <div class="acc-right"><span class="acc-preview" id="preview-scale">미입력</span><span class="acc-chevron"></span></div>
      </div>
      <div class="acc-body">
        <label class="field-title" style="margin-top:0;">체중 측정 시간</label>
        <div class="toggle-row" id="weightTimeToggle">
          <div class="toggle-opt active" data-tod="am">아침</div>
          <div class="toggle-opt" data-tod="pm">저녁</div>
        </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  // ⚠️ Firebase 콘솔에서 복사한 firebaseConfig로 교체하세요 (index.html과 동일하게)

  // ---- 사용자 프로필 상수 (BMR 계산용, 마이페이지에서 수정 가능) ----
  let BIRTH_YEAR = 1975;

  function pad2(n){ return String(n).padStart(2,"0"); }
  function dateToStr(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function todayStr(){ return dateToStr(new Date()); }

  let selectedDateStr = todayStr();
  let trendPeriod = 'week'; // 'week' | 'month'
  let weightViewTOD = 'am'; // 'am' | 'pm' — 누적추이에서 어떤 체중을 볼지
  let allLogsCache = [];
  function getW(l){ return (l.weightAM != null) ? l.weightAM : (l.weightPM != null ? l.weightPM : null); }

  function calcAge(){
    return new Date().getFullYear() - BIRTH_YEAR;
  }
  function calcBMR(weightKg){
    // Mifflin-St Jeor (남성)
    return Math.round(10*weightKg + 6.25*HEIGHT_CM - 5*calcAge() + 5);
  }

  // ---- 칼로리 섭취 카테고리 설정 ----
  const LUNCH_DINNER_CATS = [
    { id:'staple', title:'주식 (밥·면·빵)', options:[
      {key:'none',label:'없음',kcal:0},{key:'light',label:'소량(반공기)',kcal:140},
      {key:'normal',label:'보통(1공기)',kcal:280},{key:'much',label:'많음(1.5공기+)',kcal:400}
    ]},
    { id:'protein', title:'단백질 (먹은 걸 다 눌러주세요)', multi:true, options:[
      {key:'lowfat',label:'닭가슴살·두부·흰살생선',kcal:120},
      {key:'meat',label:'돼지·소고기 일반',kcal:180},
      {key:'highfat',label:'양고기·삼겹살·연어 등(고지방)',kcal:320},
      {key:'seafood',label:'해산물(새우·오징어 등)',kcal:150},
      {key:'egg',label:'계란',kcal:100}
    ]},
    { id:'fat', title:'지방·오일', options:[
      {key:'none',label:'없음',kcal:0},{key:'light',label:'조금',kcal:100},{key:'much',label:'많음',kcal:200}
    ]},
    { id:'soup', title:'국·찌개', options:[
      {key:'none',label:'안 먹음',kcal:0},{key:'light',label:'건더기 위주',kcal:100},{key:'normal',label:'국물까지',kcal:180}
    ]},
    { id:'side', title:'밑반찬·채소', options:[
      {key:'few',label:'1~2가지',kcal:30},{key:'normal',label:'3~4가지',kcal:60},{key:'many',label:'5가지 이상',kcal:100}
    ]},
    { id:'fried', title:'튀김·가공식품', options:[
      {key:'none',label:'없음',kcal:0},{key:'light',label:'조금 포함',kcal:120},{key:'much',label:'많음',kcal:250}
    ]}
  ];
  const MEAL_CATEGORIES = {
    breakfast: [
      { id:'staple', title:'주식 (빵·시리얼·밥 등)', options:[
        {key:'none',label:'없음',kcal:0},{key:'light',label:'가벼움',kcal:100},
        {key:'normal',label:'보통',kcal:200},{key:'much',label:'많음',kcal:320}
      ]},
      { id:'protein', title:'단백질 (먹은 걸 다 눌러주세요)', multi:true, options:[
        {key:'egg',label:'계란(1~2개)',kcal:150},
        {key:'yogurt',label:'그릭요거트(무가당)',kcal:100},
        {key:'nuts',label:'견과류(한 줌)',kcal:150},
        {key:'milk',label:'두유·우유(1잔)',kcal:90},
        {key:'cheese',label:'치즈(1장)',kcal:80}
      ]},
      { id:'fat', title:'지방·오일', options:[
        {key:'none',label:'없음',kcal:0},{key:'light',label:'드레싱·오일 조금',kcal:120},{key:'much',label:'드레싱·오일 많음',kcal:240}
      ]},
      { id:'fruit', title:'과일·채소', options:[
        {key:'none',label:'없음',kcal:0},{key:'light',label:'조금',kcal:40},{key:'normal',label:'보통',kcal:80}
      ]}
    ],
    lunch: LUNCH_DINNER_CATS,
    dinner: LUNCH_DINNER_CATS,
    snack: [
      { id:'type', title:'유형', multi:true, options:[
        {key:'fruit',label:'과일',kcal:60},{key:'nuts',label:'견과류',kcal:150},
        {key:'drink',label:'커피/음료',kcal:60},{key:'bread',label:'빵·과자류',kcal:200},{key:'none',label:'없음',kcal:0}
      ]},
      { id:'amount', title:'양', options:[
        {key:'light',label:'조금',mult:0.7},{key:'normal',label:'보통',mult:1.0},{key:'much',label:'많음',mult:1.4}
      ]}
    ]
  };
  const mealSelections = { breakfast:{}, lunch:{}, dinner:{}, snack:{} };

  function renderMealCategories(mealKey){
    const container = document.getElementById(`cat-${mealKey}`);
    const groups = MEAL_CATEGORIES[mealKey];
    container.innerHTML = groups.map(g => `
      <div class="cat-group" data-group="${g.id}">
        <div class="cat-title">${g.title}${g.multi ? ' <span style="font-weight:400;color:var(--text-dim);font-size:10.5px;">(중복 선택 가능)</span>' : ''}</div>
        <div class="chip-row">
          ${g.options.map(o => `<div class="cat-chip" data-key="${o.key}" data-kcal="${o.kcal ?? ''}" data-mult="${o.mult ?? ''}">${o.label}</div>`).join('')}
        </div>
      </div>
    `).join('');
  }
  ['breakfast','lunch','dinner','snack'].forEach(renderMealCategories);

  // ---- 칼로리 섭취: 직접입력 / 사진업로드 모드 ----
  let mealInputMode = 'category';
  const mealPhotoUrls = {};

  // ---- 체중: 아침/저녁 구분 입력 ----
  let weightTimeOfDay = 'am';
  const weightValues = { am: null, pm: null };

  document.getElementById('weightTimeToggle').addEventListener('click', (e)=>{
    const opt = e.target.closest('.toggle-opt');
    if (!opt) return;
    document.querySelectorAll('#weightTimeToggle .toggle-opt').forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    weightTimeOfDay = opt.dataset.tod;
    const val = weightValues[weightTimeOfDay];
    document.getElementById('input-weight').value = (val != null) ? val : '';
    updateCardStates();
  });

  window.onWeightInput = function(){
    const v = document.getElementById('input-weight').value;
    weightValues[weightTimeOfDay] = v ? Number(v) : null;
    onFieldChange();
  };

  function applyMealModeVisibility(){
    ['breakfast','lunch','dinner','snack'].forEach(m=>{
      document.getElementById(`cat-${m}`).style.display = mealInputMode==='category' ? '' : 'none';
      document.getElementById(`photo-${m}`).style.display = mealInputMode==='photo' ? '' : 'none';
    });
  }
  applyMealModeVisibility();

  document.getElementById('mealModeToggle').addEventListener('click', (e)=>{
    const opt = e.target.closest('.toggle-opt');
    if (!opt) return;
    document.querySelectorAll('#mealModeToggle .toggle-opt').forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    mealInputMode = opt.dataset.mode;
    applyMealModeVisibility();
    updateCardStates();
  });

  window.onPhotoSelected = async function(mealKey, inputEl){
    const file = inputEl.files[0];
    if (!file) return;
    const label = document.getElementById(`photo-drop-label-${mealKey}`);
    label.textContent = '업로드 중...';
    try {
      const path = `meal-photos/${selectedDateStr}/${mealKey}-${Date.now()}.jpg`;
      const sRef = storageRef(storage, path);
      await uploadBytes(sRef, file);
      const url = await getDownloadURL(sRef);
      mealPhotoUrls[mealKey] = url;
      const thumb = document.getElementById(`photo-thumb-${mealKey}`);
      thumb.src = url;
      thumb.style.display = 'block';
      label.textContent = '📷 사진 변경';
      updateCardStates();
    } catch(err){
      console.error(err);
      label.textContent = '업로드 실패 — 다시 시도';
    }
  };

  function computeMealKcal(mealKey){
    if (mealInputMode === 'photo'){
      const total = Number(document.getElementById(`photo-kcal-${mealKey}`).value) || 0;
      document.getElementById(`kcal-${mealKey}`).textContent = `${total} kcal`;
      return total;
    }
    const sel = mealSelections[mealKey];
    const groups = MEAL_CATEGORIES[mealKey];
    let kcal = 0;
    let multiplier = 1;
    groups.forEach(g=>{
      const val = sel[g.id];
      const keys = g.multi ? (Array.isArray(val) ? val : (val ? [val] : [])) : (val ? [val] : []);
      keys.forEach(key=>{
        const opt = g.options.find(o=>o.key===key);
        if (!opt) return;
        if (opt.mult !== undefined) multiplier *= opt.mult;
        else kcal += (opt.kcal || 0);
      });
    });
    const total = Math.round(kcal * multiplier);
    document.getElementById(`kcal-${mealKey}`).textContent = `${total} kcal`;
    return total;
  }

  document.querySelectorAll('.cat-container').forEach(container => {
    container.addEventListener('click', (e) => {
      const chip = e.target.closest('.cat-chip');
      if (!chip) return;
      const group = chip.closest('.cat-group');
      const mealKey = container.id.replace('cat-','');
      const groupConfig = MEAL_CATEGORIES[mealKey].find(g=>g.id===group.dataset.group);
      if (groupConfig && groupConfig.multi){
        chip.classList.toggle('selected');
        let arr = Array.isArray(mealSelections[mealKey][group.dataset.group]) ? mealSelections[mealKey][group.dataset.group] : [];
        arr = chip.classList.contains('selected') ? [...arr, chip.dataset.key] : arr.filter(k=>k!==chip.dataset.key);
        mealSelections[mealKey][group.dataset.group] = arr;
      } else {
        group.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        mealSelections[mealKey][group.dataset.group] = chip.dataset.key;
      }
      computeMealKcal(mealKey);
      updateCardStates();
    });
  });

  let currentUser = null;

  const DEBUG_MODE = new URLSearchParams(window.location.search).has("debug");

  onAuthStateChanged(auth, async (user) => {
    if (DEBUG_MODE) {
      document.body.insertAdjacentHTML("afterbegin",
        `<div style="margin:16px;padding:12px;background:#EEF6F1;border:1px solid #CFE3D6;border-radius:8px;font-size:12px;color:#1d5c3d;">
           [DEBUG] app.html 상태<br>
           user: ${user ? user.email : "null (로그인 안됨)"}<br>
           uid: ${user ? user.uid : "-"}
         </div>`);
      if (!user) return; // 디버그 모드에서는 리다이렉트 안 함
    }
    if (!user) {
      if (sessionStorage.getItem("hd_bounced_from_index")) {
        // index.html에서 이미 한 번 튕겨져 온 상태 — 루프 발생, 중단하고 진단 표시
        sessionStorage.removeItem("hd_bounced_from_index");
        document.body.insertAdjacentHTML("afterbegin",
          `<div style="margin:16px;padding:12px;background:#FBEAE8;border:1px solid #E8C4C0;border-radius:8px;font-size:12px;color:#8a2f26;">
             index.html은 로그인 상태로 인식했는데 이 페이지(app.html)에서는 비로그인으로 판단됩니다.<br>
             콘솔(F12)에서 에러 메시지를 확인해주세요.
             <a href="index.html" style="color:#8a2f26;">로그인 페이지로 이동</a>
           </div>`);
        console.warn("[Healthy Day] 리다이렉트 루프 감지: app.html에서 user가 null입니다. auth.currentUser:", auth.currentUser);
        return;
      }
      sessionStorage.setItem("hd_bounced_from_app", "1");
      window.location.href = "index.html";
      return;
    }
    sessionStorage.removeItem("hd_bounced_from_index");
    sessionStorage.removeItem("hd_bounced_from_app");
    currentUser = user;
    document.getElementById("userEmail").textContent = user.email;
    await loadProfile();
    initDateNav();
    loadForDate(selectedDateStr);
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });

  // ---- 마이페이지: 개인 프로필 ----
  async function loadProfile(){
    try {
      const ref = doc(db, "profile", "main");
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const p = snap.data();
        if (p.birthYear) BIRTH_YEAR = p.birthYear;
        if (p.height) HEIGHT_CM = p.height;
        document.getElementById("profile-name").value = p.name || "";
        document.getElementById("profile-birthyear").value = p.birthYear || "";
        document.getElementById("profile-height").value = p.height || "";
      } else {
        document.getElementById("profile-birthyear").value = BIRTH_YEAR;
        document.getElementById("profile-height").value = HEIGHT_CM;
      }
    } catch(err){ console.error("프로필 로드 실패", err); }
  }

  window.saveProfile = async function(){
    const btn = document.getElementById("profileSaveBtn");
    btn.disabled = true;
    btn.textContent = "저장 중...";
    const birthYear = Number(document.getElementById("profile-birthyear").value) || BIRTH_YEAR;
    const height = Number(document.getElementById("profile-height").value) || HEIGHT_CM;
    try {
      await setDoc(doc(db, "profile", "main"), {
        name: document.getElementById("profile-name").value.trim(),
        birthYear, height, updatedAt: serverTimestamp()
      }, { merge: true });
      BIRTH_YEAR = birthYear;
      HEIGHT_CM = height;
      btn.textContent = "저장 완료 ✓";
      setTimeout(()=>{ btn.textContent = "저장"; btn.disabled = false; }, 1500);
    } catch(err){
      console.error(err);
      btn.textContent = "저장 실패 — 다시 시도";
      btn.disabled = false;
    }
  };

  // ---- 날짜 네비게이션 ----
  function initDateNav(){
    document.getElementById("dateInput").value = selectedDateStr;
    updateDateDisplay();
  }
  function updateDateDisplay(){
    const isToday = selectedDateStr === todayStr();
    const d = new Date(selectedDateStr + "T00:00:00");
    const label = `${d.getMonth()+1}.${d.getDate()} (${["일","월","화","수","목","금","토"][d.getDay()]})`;
    document.getElementById("dateDisplay").innerHTML = label + (isToday ? `<span class="today-badge">오늘</span>` : `<span class="past-badge">과거</span>`);
    document.getElementById("dashDateLabel").textContent = selectedDateStr;
    document.getElementById("submitBtn").textContent = isToday ? "오늘 기록 마감하기" : "이 날짜 기록 저장하기";
  }
  window.changeDate = function(delta){
    const d = new Date(selectedDateStr + "T00:00:00");
    d.setDate(d.getDate()+delta);
    selectedDateStr = dateToStr(d);
    document.getElementById("dateInput").value = selectedDateStr;
    updateDateDisplay();
    loadForDate(selectedDateStr);
  };
  window.onDatePicked = function(){
    selectedDateStr = document.getElementById("dateInput").value;
    updateDateDisplay();
    loadForDate(selectedDateStr);
  };

    document.querySelectorAll("#levelRow .level-opt").forEach(o=>o.classList.remove("selected"));

    document.querySelectorAll("#dayTypeToggle .chip").forEach(c=>c.classList.remove("selected"));

    renderWorkTypeChips();
    selectedWorkTypes.clear();

    mealInputMode = 'category';
    applyMealModeVisibility();
    ["breakfast","lunch","dinner","snack"].forEach(m=>{
      mealSelections[m] = {};
      document.querySelectorAll(`#cat-${m} .cat-chip`).forEach(c=>c.classList.remove("selected"));

      document.getElementById(`photo-file-${m}`).value = "";
      document.getElementById(`photo-thumb-${m}`).style.display = "none";
      document.getElementById(`photo-thumb-${m}`).src = "";
      document.getElementById(`photo-kcal-${m}`).value = "";
      document.getElementById(`photo-drop-label-${m}`).textContent = "📷 사진 선택 / 촬영";
      computeMealKcal(m);
    });
    ["input-weight","input-bodyfat","input-muscle","input-fatmass","input-visceral"].forEach(id=>{
      document.getElementById(id).value = "";
    });
    weightValues.am = null;
    weightValues.pm = null;
    weightTimeOfDay = 'am';
    document.querySelectorAll("#weightTimeToggle .toggle-opt").forEach(o=>o.classList.toggle("active", o.dataset.tod==="am"));
  }

  async function loadForDate(dateStr){
    resetInputForm();
    const ref = doc(db, "dailyLogs", dateStr);
    const snap = await getDoc(ref);
    if (snap.exists()) applyLogData(snap.data());
    updateCardStates();
  }

  // ---- 아코디언 ----
  window.toggleCard = function(headerEl){
    headerEl.closest(".card").classList.toggle("open");
  };

  window.showScreen = function(name){
    document.getElementById("screen-input").classList.toggle("active", name==="input");
    document.getElementById("screen-dashboard").classList.toggle("active", name==="dashboard");
    document.getElementById("screen-mypage").classList.toggle("active", name==="mypage");
    document.querySelectorAll(".nav-item").forEach((el,i)=>{
      el.classList.toggle("active", (name==="input"&&i===0)||(name==="dashboard"&&i===1)||(name==="mypage"&&i===2));
    });
    if (name==="dashboard") loadDashboard();
  };

  // ---- 체감 강도(1-5, 단일선택) ----
  let selectedLevel = null;
  document.getElementById("levelRow").addEventListener("click", (e) => {
    const opt = e.target.closest(".level-opt");
    if (!opt) return;
    document.querySelectorAll("#levelRow .level-opt").forEach(o=>o.classList.remove("selected"));
    opt.classList.add("selected");
    selectedLevel = { level: Number(opt.dataset.level), bonus: Number(opt.dataset.bonus), label: opt.querySelector(".lv-label").textContent };
    updateCardStates();
  });

  // ---- 근무일/휴무일 → 작업 유형(중복선택) 동적 전환 ----
  const WORK_TYPE_OPTIONS = ['정상 생산','샘플 작업','신규 제품 생산','불량 조치','기타 이슈'];
  const REST_TYPE_OPTIONS = ['집안일','외출·나들이','운동','휴식 위주','기타'];
  let selectedDayType = 'work';
  const selectedWorkTypes = new Set();

  function renderWorkTypeChips(){
    const opts = selectedDayType === 'rest' ? REST_TYPE_OPTIONS : WORK_TYPE_OPTIONS;
    document.getElementById('intensityCardTitle').textContent = selectedDayType === 'rest' ? '휴무 활동' : '작업 강도';
    document.getElementById('levelSection').style.display = selectedDayType === 'rest' ? 'none' : 'block';
    document.getElementById('workTypeTitle').textContent = selectedDayType === 'rest' ? '휴무 활동 (중복 선택 가능)' : '작업 유형 (중복 선택 가능)';
    document.getElementById('workTypeChips').innerHTML = opts.map(v =>
      `<div class="chip multi" data-value="${v}">${v}</div>`
    ).join('');
  }
  renderWorkTypeChips();

  document.getElementById("dayTypeToggle").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    document.querySelectorAll("#dayTypeToggle .chip").forEach(c=>c.classList.remove("selected"));
    chip.classList.add("selected");
    selectedDayType = chip.dataset.value;
    selectedWorkTypes.clear();
    if (selectedDayType === 'rest') {
      document.querySelectorAll("#levelRow .level-opt").forEach(o=>o.classList.remove("selected"));
      selectedLevel = null;
    }
    renderWorkTypeChips();
    updateCardStates();
  });

  document.getElementById("workTypeChips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip.multi");
    if (!chip) return;
    chip.classList.toggle("selected");
    if (chip.classList.contains("selected")) selectedWorkTypes.add(chip.dataset.value);
    else selectedWorkTypes.delete(chip.dataset.value);
    updateCardStates();
  });

  // ---- 식사 탭 전환 ----
  document.getElementById("mealTabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".meal-tab");
    if (!tab) return;
    document.querySelectorAll(".meal-tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".meal-block").forEach(b=>b.classList.remove("active"));
    tab.classList.add("active");
    document.querySelector(`.meal-block[data-meal="${tab.dataset.meal}"]`).classList.add("active");
  });

  // ---- 카드 상태(입력완료 표시, 미리보기) 갱신 ----
  window.onFieldChange = function(){ updateCardStates(); };

  function updateCardStates(){
    const steps = document.getElementById("input-steps").value;
    const stepsCard = document.getElementById("card-steps");
    stepsCard.classList.toggle("filled", !!steps);
    document.getElementById("preview-steps").textContent = steps ? `${Number(steps).toLocaleString()}보` : "미입력";

    const intensityCard = document.getElementById("card-intensity");
    intensityCard.classList.toggle("filled", !!selectedLevel || selectedWorkTypes.size>0);
    const intensityParts = [];
    if (selectedLevel) intensityParts.push(`Lv${selectedLevel.level}·${selectedLevel.label}`);
    if (selectedWorkTypes.size) intensityParts.push([...selectedWorkTypes].join(","));
    document.getElementById("preview-intensity").textContent = intensityParts.length ? intensityParts.join(" / ") : "미입력";

    const totalMealKcal = ["breakfast","lunch","dinner","snack"].reduce((s,m)=>{
      const tab = document.querySelector(`.meal-tab[data-meal="${m}"]`);
      tab.classList.toggle("filled", Object.keys(mealSelections[m]).length>0);
      return s+computeMealKcal(m);
    },0);
    const anyMealSelected = ["breakfast","lunch","dinner","snack"].some(m=>Object.keys(mealSelections[m]).length>0);
    const mealsCard = document.getElementById("card-meals");
    mealsCard.classList.toggle("filled", anyMealSelected);
    document.getElementById("preview-meals").textContent = anyMealSelected ? `총 ${totalMealKcal}kcal` : "미입력";

    const scaleCard = document.getElementById("card-scale");
    const hasWeight = weightValues.am != null || weightValues.pm != null;
    scaleCard.classList.toggle("filled", hasWeight);
    document.getElementById("preview-scale").textContent = hasWeight
      ? `아침${weightValues.am!=null?` ${weightValues.am}`:' -'}kg · 저녁${weightValues.pm!=null?` ${weightValues.pm}`:' -'}kg`
      : "미입력";

    // BMI 자동계산 (마이페이지에서 설정한 키 기준) — 현재 보고 있는 아침/저녁 값 기준
    const bmiField = document.getElementById("input-bmi");
    const currentWeight = weightValues[weightTimeOfDay];
    if (currentWeight != null) {
      const heightM = HEIGHT_CM / 100;
      const bmi = (currentWeight / (heightM * heightM)).toFixed(1);
      bmiField.value = bmi;
    } else {
      bmiField.value = "";
    }
  }

  // ---- 저장 ----
  window.saveLog = async function(){
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "저장 중...";

    const meals = {};
    ["breakfast","lunch","dinner","snack"].forEach(m=>{
      if (mealInputMode === 'photo') {
        meals[m] = { photoUrl: mealPhotoUrls[m] || null, kcal: computeMealKcal(m) };
      } else {
        meals[m] = { selections: {...mealSelections[m]}, kcal: computeMealKcal(m) };
      }
    });

    const data = {
      steps: Number(document.getElementById("input-steps").value) || 0,
      intensityLevel: selectedLevel ? selectedLevel.level : null,
      intensityBonus: selectedLevel ? selectedLevel.bonus : 0,
      workTypes: [...selectedWorkTypes],
      dayType: selectedDayType,
      mealInputMode,
      meals,
      weightAM: weightValues.am,
      weightPM: weightValues.pm,
      bodyFat: Number(document.getElementById("input-bodyfat").value) || null,
      muscleMass: Number(document.getElementById("input-muscle").value) || null,
      fatMass: Number(document.getElementById("input-fatmass").value) || null,
      visceralFat: Number(document.getElementById("input-visceral").value) || null,
      updatedAt: serverTimestamp()
    };

    try {
      const ref = doc(db, "dailyLogs", selectedDateStr);
      const existing = await getDoc(ref);
      if (!existing.exists()) data.createdAt = serverTimestamp();
      await setDoc(ref, data, { merge: true });
      btn.textContent = "저장 완료 ✓";
      const isToday = selectedDateStr === todayStr();
      setTimeout(()=>{ btn.textContent = isToday ? "오늘 기록 마감하기" : "이 날짜 기록 저장하기"; btn.disabled = false; }, 1500);
      loadDashboard();
    } catch (err) {
      console.error(err);
      btn.textContent = "저장 실패 — 다시 시도";
      btn.disabled = false;
    }
  };

  // ---- 오늘 기록 불러와서 입력폼 채우기 (이미 입력했으면 이어서 수정) ----
  function applyLogData(d){
    if (d.steps) document.getElementById("input-steps").value = d.steps;
    if (d.intensityLevel) {
      const opt = document.querySelector(`.level-opt[data-level="${d.intensityLevel}"]`);
      if (opt) {
        opt.classList.add("selected");
        selectedLevel = { level: d.intensityLevel, bonus: d.intensityBonus||0, label: opt.querySelector(".lv-label").textContent };
      }
    }
    if (d.dayType) {
      selectedDayType = d.dayType;
      document.querySelectorAll("#dayTypeToggle .chip").forEach(c=>{
        c.classList.toggle("selected", c.dataset.value === d.dayType);
      });
      renderWorkTypeChips();
    }
    if (d.workTypes) {
      d.workTypes.forEach(v=>{
        const chip = document.querySelector(`#workTypeChips .chip.multi[data-value="${v}"]`);
        if (chip) { chip.classList.add("selected"); selectedWorkTypes.add(v); }
      });
    }
    if (d.mealInputMode) {
      mealInputMode = d.mealInputMode;
      document.querySelectorAll("#mealModeToggle .toggle-opt").forEach(o=>{
        o.classList.toggle("active", o.dataset.mode === d.mealInputMode);
      });
      applyMealModeVisibility();
    }
    if (d.meals) {
      Object.keys(d.meals).forEach(m=>{
        const mealData = d.meals[m];
        if (mealData.photoUrl !== undefined) {
          if (mealData.photoUrl) {
            mealPhotoUrls[m] = mealData.photoUrl;
            const thumb = document.getElementById(`photo-thumb-${m}`);
            thumb.src = mealData.photoUrl;
            thumb.style.display = 'block';
            document.getElementById(`photo-drop-label-${m}`).textContent = '📷 사진 변경';
          }
          if (mealData.kcal) document.getElementById(`photo-kcal-${m}`).value = mealData.kcal;
        } else {
          const selections = mealData.selections || {};
          Object.keys(selections).forEach(groupId=>{
            const val = selections[groupId];
            const keys = Array.isArray(val) ? val : [val];
            keys.forEach(key=>{
              const chip = document.querySelector(`#cat-${m} .cat-group[data-group="${groupId}"] .cat-chip[data-key="${key}"]`);
              if (chip) chip.classList.add("selected");
            });
            mealSelections[m][groupId] = val;
          });
        }
        computeMealKcal(m);
      });
    }
    if (d.weightAM != null) weightValues.am = d.weightAM;
    if (d.weightPM != null) weightValues.pm = d.weightPM;
    weightTimeOfDay = (d.weightAM != null) ? 'am' : (d.weightPM != null ? 'pm' : 'am');
    document.querySelectorAll("#weightTimeToggle .toggle-opt").forEach(o=>o.classList.toggle("active", o.dataset.tod===weightTimeOfDay));
    const wVal = weightValues[weightTimeOfDay];
    if (wVal != null) document.getElementById("input-weight").value = wVal;
    if (d.bodyFat) document.getElementById("input-bodyfat").value = d.bodyFat;
    if (d.muscleMass) document.getElementById("input-muscle").value = d.muscleMass;
    if (d.fatMass) document.getElementById("input-fatmass").value = d.fatMass;
    if (d.visceralFat) document.getElementById("input-visceral").value = d.visceralFat;
    updateCardStates();
  }

  // ---- 대시보드 ----
  async function loadDashboard(){
    const container = document.getElementById("dashContent");
    const q = query(collection(db, "dailyLogs"), orderBy("__name__", "asc"));
    const snap = await getDocs(q);
    const logs = [];
    snap.forEach(docSnap => logs.push({ id: docSnap.id, ...docSnap.data() }));
    allLogsCache = logs;

    if (logs.length === 0) {
      container.innerHTML = `<div class="empty-state">아직 기록이 없어요.<br>입력 탭에서 먼저 기록해주세요.</div>`;
      return;
    }

    const today = logs.find(l => l.id === selectedDateStr) || logs[logs.length-1];
    const totalKcal = today.meals ? Object.values(today.meals).reduce((s,m)=>s+(m.kcal||0),0) : 0;
    const weightForBMR = getW(today) || [...logs].reverse().map(getW).find(w=>w) || 67;
    const bmr = calcBMR(weightForBMR);
    const activityKcal = Math.round((today.steps||0) * STEP_KCAL);
    const tdee = bmr + activityKcal + (today.intensityBonus||0);
    const balance = totalKcal - tdee;

    const pct = Math.max(0, Math.min(100, ((totalKcal/tdee)*100)));

    let balanceColor = "var(--amber)";
    if (balance > -300 && balance < 200) balanceColor = "var(--green)";
    if (balance < -600) balanceColor = "var(--red)";

    function filterByPeriod(allLogs, period){
      const endDate = new Date(selectedDateStr+"T00:00:00");
      const days = period === 'month' ? 30 : 7;
      const startDate = new Date(endDate);
      startDate.setDate(startDate.getDate() - (days-1));
      return allLogs.filter(l=>{
        const d = new Date(l.id+"T00:00:00");
        return d >= startDate && d <= endDate;
      });
    }
    const trendLogs = filterByPeriod(logs, trendPeriod);

    const weightField = weightViewTOD === 'am' ? 'weightAM' : 'weightPM';
    const weightLogs = trendLogs.filter(l => l[weightField] != null);
    const firstW = weightLogs[0]?.[weightField];
    const lastW = weightLogs[weightLogs.length-1]?.[weightField];
    const delta = (firstW && lastW) ? (lastW - firstW).toFixed(1) : null;

    function trendFor(field, digits){
      const arr = trendLogs.filter(l => l[field] != null);
      if (!arr.length) return null;
      const first = arr[0][field], last = arr[arr.length-1][field];
      const d = (last - first).toFixed(digits);
      return { last: last.toFixed(digits), delta: d, count: arr.length };
    }
    const bodyFatTrend = trendFor('bodyFat', 1);
    const muscleTrend = trendFor('muscleMass', 2);
    const fatMassTrend = trendFor('fatMass', 2);
    const visceralTrend = trendFor('visceralFat', 0);

    let svgPoints = "";
    if (weightLogs.length >= 2) {
      const ws = weightLogs.map(l=>l[weightField]);
      const min = Math.min(...ws), max = Math.max(...ws);
      const range = (max-min) || 1;
      svgPoints = weightLogs.map((l,i)=>{
        const x = (i/(weightLogs.length-1))*340;
        const y = 20 + (1 - (l[weightField]-min)/range) * 62;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
    }

    // ---- 주간 밸런스 계산 (최근 7일 기록) ----
    let carryWeight = 67;
    const balanceSeries = logs.map(l=>{
      if (getW(l)) carryWeight = getW(l);
      const dayKcal = l.meals ? Object.values(l.meals).reduce((s,m)=>s+(m.kcal||0),0) : 0;
      const dayBmr = calcBMR(carryWeight);
      const dayActivity = Math.round((l.steps||0) * STEP_KCAL);
      const dayTdee = dayBmr + dayActivity + (l.intensityBonus||0);
      return { date: l.id, balance: dayKcal - dayTdee };
    });
    const last7 = balanceSeries.slice(-7);
    let weeklyBars = "";
    if (last7.length){
      const maxAbs = Math.max(800, ...last7.map(d=>Math.abs(d.balance)));
      const barW = 300/last7.length;
      const midY = 45;
      weeklyBars = last7.map((d,i)=>{
        const h = Math.min(38, (Math.abs(d.balance)/maxAbs)*38);
        const x = i*barW + barW*0.2;
        const w = barW*0.6;
        const color = d.balance < -600 ? "#C4483C" : d.balance < -300 ? "#C67A1E" : d.balance < 200 ? "#2E9563" : "#C67A1E";
        const y = d.balance >= 0 ? midY - h : midY;
        const label = d.date.slice(5).replace('-','.');
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}"/>
                <text x="${(x+w/2).toFixed(1)}" y="70" font-family="IBM Plex Mono" font-size="8" fill="#A6A296" text-anchor="middle">${label}</text>`;
      }).join("");
    }

    const bmi = getW(today) ? (getW(today) / ((HEIGHT_CM/100)**2)).toFixed(1) : null;
    let bodyCompNote = "체성분 데이터가 아직 없어요";
    if (today.bodyFat != null) {
      const bf = today.bodyFat;
      const bfNote = bf < 18 ? "탄탄한 체성분을 유지하고 있어요" : bf < 24 ? "무난한 체성분 상태예요" : "체지방 비중이 다소 높은 편이에요";
      bodyCompNote = `체지방률 <b>${bf}%</b>${today.muscleMass ? `, 골격근량 <b>${today.muscleMass}kg</b>` : ""}${bmi ? ` (BMI ${bmi})` : ""} — ${bfNote}`;
    }
    const activityNote = today.dayType === 'rest'
      ? `<b>휴무일</b> · ${(today.workTypes&&today.workTypes.length)?today.workTypes.join(", "):"특별한 활동 없음"} (${today.steps||0}보)`
      : `<b>근무일</b> · 체감 강도 Lv${today.intensityLevel||"—"} · ${(today.workTypes&&today.workTypes.length)?today.workTypes.join(", "):"미입력"} (${today.steps||0}보)`;
    const balanceNote = balance < -600 ? "활동량 대비 섭취가 많이 부족한 편이에요"
      : balance < -300 ? "활동량 대비 섭취가 다소 부족한 편이에요"
      : balance < 200 ? "활동량과 섭취가 균형 잡힌 편이에요"
      : "섭취가 활동량보다 다소 많은 편이에요";

    container.innerHTML = `
      <div class="gauge-card">
        <div class="acc-header" style="padding:0 0 14px;"><div class="acc-header-left"><span class="acc-title" style="color:var(--text)">오늘의 밸런스</span></div></div>
        <div class="gauge-wrap">
          <div class="gauge-num">
            <div class="big" style="color:${balanceColor}">${balance>=0?"+":""}${balance}</div>
            <div class="label">kcal 밸런스</div>
          </div>
          <div class="balance-bar">
            <div class="balance-track"><div class="balance-fill" style="left:0; width:${pct}%;"></div></div>
            <div class="balance-labels"><span>섭취 ${totalKcal}</span><span>소비 ${tdee}</span></div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="k">기초대사량</div><div class="v">${bmr} <span style="font-size:10px;color:var(--text-dim)">kcal</span></div></div>
          <div class="stat-box"><div class="k">활동+근무 보정</div><div class="v">${activityKcal + (today.intensityBonus||0)} <span style="font-size:10px;color:var(--text-dim)">kcal</span></div></div>
        </div>
        ${last7.length > 1 ? `
        <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line);">
          <div style="font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-bottom:6px;">주간 밸런스 추이</div>
          <svg viewBox="0 0 340 78" style="width:100%;">
            <line x1="0" y1="45" x2="340" y2="45" stroke="#E6E2D8" stroke-width="1"/>
            ${weeklyBars}
          </svg>
        </div>` : ''}
      </div>

      <div class="card open">
        <div class="acc-header"><div class="acc-header-left"><span class="acc-title" style="color:var(--text)">종합 분석</span></div></div>
        <div class="acc-body" style="max-height:600px; padding:0 18px 18px;">
          <div class="analysis-line">
            <div class="tag">체성분</div>
            <div class="body"><span class="status-dot ok"></span>${bodyCompNote}</div>
          </div>
          <div class="analysis-line">
            <div class="tag">활동</div>
            <div class="body">${activityNote}</div>
          </div>
          <div class="analysis-line">
            <div class="tag">총평</div>
            <div class="body"><span class="status-dot ${balance<-600?'bad':balance<-300?'warn':'ok'}"></span>${balanceNote}</div>
          </div>
        </div>
      </div>

      <div class="card open">
        <div class="acc-header">
          <div class="acc-header-left"><span class="acc-title" style="color:var(--text)">누적 추이</span></div>
          <div class="toggle-row" style="margin-bottom:0;">
            <div class="toggle-opt ${trendPeriod==='week'?'active':''}" onclick="setTrendPeriod('week')">주</div>
            <div class="toggle-opt ${trendPeriod==='month'?'active':''}" onclick="setTrendPeriod('month')">월</div>
          </div>
        </div>
        <div class="acc-body" style="max-height:600px; padding:0 18px 18px;">
          <div class="toggle-row" style="margin-bottom:12px;">
            <div class="toggle-opt ${weightViewTOD==='am'?'active':''}" onclick="setWeightView('am')">체중(아침)</div>
            <div class="toggle-opt ${weightViewTOD==='pm'?'active':''}" onclick="setWeightView('pm')">체중(저녁)</div>
          </div>
          ${lastW ? `
          <div class="weight-hero">
            <span class="num">${lastW}<span style="font-size:14px;">kg</span></span>
            ${delta ? `<span class="delta">${delta<0?"▼":"▲"} ${Math.abs(delta)}kg</span>` : ""}
          </div>
          <div class="trend-meta">${firstW}kg → ${lastW}kg · ${trendPeriod==='week'?'최근 1주':'최근 1개월'} ${weightLogs.length}회 기록</div>
          ${svgPoints ? `
          <svg viewBox="0 0 340 90" style="width:100%; margin-top:14px;">
            <polyline points="${svgPoints}" fill="none" stroke="#C67A1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>` : `<div class="empty-state">추이를 보려면 2회 이상 기록이 필요해요</div>`}
          ` : `<div class="empty-state">${trendPeriod==='week'?'최근 1주':'최근 1개월'} ${weightViewTOD==='am'?'아침':'저녁'} 체중 기록이 없어요</div>`}

          ${(bodyFatTrend || muscleTrend || fatMassTrend || visceralTrend) ? `
          <div class="stat-grid" style="margin-top:14px;">
            ${bodyFatTrend ? `<div class="stat-box" onclick="showMetricDetail('bodyFat','체지방률','%',1,'#C67A1E')" style="cursor:pointer;"><div class="k">체지방률 ›</div><div class="v">${bodyFatTrend.last}% <span style="font-size:10px;color:${bodyFatTrend.delta<0?'var(--green)':'var(--amber)'}">${bodyFatTrend.delta<0?"▼":"▲"}${Math.abs(bodyFatTrend.delta)}</span></div></div>` : ''}
            ${muscleTrend ? `<div class="stat-box" onclick="showMetricDetail('muscleMass','골격근량','kg',2,'#2E9563')" style="cursor:pointer;"><div class="k">골격근량 ›</div><div class="v">${muscleTrend.last}kg <span style="font-size:10px;color:${muscleTrend.delta>=0?'var(--green)':'var(--amber)'}">${muscleTrend.delta>=0?"▲":"▼"}${Math.abs(muscleTrend.delta)}</span></div></div>` : ''}
            ${fatMassTrend ? `<div class="stat-box" onclick="showMetricDetail('fatMass','체지방량','kg',2,'#C4483C')" style="cursor:pointer;"><div class="k">체지방량 ›</div><div class="v">${fatMassTrend.last}kg <span style="font-size:10px;color:${fatMassTrend.delta<=0?'var(--green)':'var(--amber)'}">${fatMassTrend.delta<=0?"▼":"▲"}${Math.abs(fatMassTrend.delta)}</span></div></div>` : ''}
            ${visceralTrend ? `<div class="stat-box" onclick="showMetricDetail('visceralFat','내장지방지수','',0,'#6F6C63')" style="cursor:pointer;"><div class="k">내장지방지수 ›</div><div class="v">${visceralTrend.last} <span style="font-size:10px;color:${visceralTrend.delta<=0?'var(--green)':'var(--amber)'}">${visceralTrend.delta<=0?"▼":"▲"}${Math.abs(visceralTrend.delta)}</span></div></div>` : ''}
          </div>` : ''}
        </div>
      </div>
    `;
  }

  window.setTrendPeriod = function(p){
    trendPeriod = p;
    loadDashboard();
  };
  window.setWeightView = function(tod){
    weightViewTOD = tod;
    loadDashboard();
  };

  window.showMetricDetail = function(field, label, unit, digits, color){
    const arr = allLogsCache.filter(l => l[field] != null);
    const overlay = document.getElementById('metricDetailOverlay');
    if (!arr.length){
      overlay.querySelector('.detail-body').innerHTML = `<div class="empty-state">${label} 기록이 아직 없어요</div>`;
      overlay.querySelector('.detail-title').textContent = label;
      overlay.style.display = 'flex';
      return;
    }
    const vals = arr.map(l=>l[field]);
    const latest = vals[vals.length-1];
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min) || 1;
    const points = arr.map((l,i)=>{
      const x = arr.length>1 ? (i/(arr.length-1))*300 : 150;
      const y = 16 + (1 - (l[field]-min)/range) * 70;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    const firstDate = arr[0].id.slice(5).replace('-','.');
    const lastDate = arr[arr.length-1].id.slice(5).replace('-','.');
    overlay.querySelector('.detail-title').textContent = label;
    overlay.querySelector('.detail-body').innerHTML = `
      <div class="weight-hero">
        <span class="num" style="color:${color}">${latest.toFixed(digits)}<span style="font-size:14px;">${unit}</span></span>
      </div>
      <div class="trend-meta">최저 ${min.toFixed(digits)}${unit} · 최고 ${max.toFixed(digits)}${unit} · 총 ${arr.length}회 기록</div>
      ${arr.length>1 ? `
      <svg viewBox="0 0 300 100" style="width:100%; margin-top:16px;">
        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div style="display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:2px;">
        <span>${firstDate}</span><span>${lastDate}</span>
      </div>` : `<div class="empty-state">추이를 보려면 2회 이상 기록이 필요해요</div>`}
    `;
    overlay.style.display = 'flex';
  };
  window.closeMetricDetail = function(){
    document.getElementById('metricDetailOverlay').style.display = 'none';
  };
</script>

</body>
</html>
